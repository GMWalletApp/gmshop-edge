name: project-automation

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify webhook delivery without dispatching automation
        type: boolean
        default: false
  schedule:
    - cron: "0 */6 * * *"
  issues:
    types: [opened, edited, reopened, labeled]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: project-automation-${{ github.repository }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  automate:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.issue.state == 'open' || github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Verify automation contract
        run: |
          bun test scripts/project-automation-workflow.test.ts
          bun test scripts/project-automation-webhook.test.ts

      - name: Collect repository context
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bun run scripts/project-automation-context.ts

      - name: Send automation webhook
        env:
          AUTOMATION_WEBHOOK_URL: ${{ secrets.AUTOMATION_WEBHOOK_URL }}
          AUTOMATION_WEBHOOK_SECRET: ${{ secrets.AUTOMATION_WEBHOOK_SECRET }}
          AUTOMATION_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_ACTION: ${{ github.event.action || '' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bun run scripts/project-automation-webhook.ts
